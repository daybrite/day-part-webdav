[package]
name = "webdav-explorer"
version.workspace = true
edition = "2024"
license = "MPL-2.0"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# Cargo defaults to rlib; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"

[dependencies]
day = { package = "day-app", version = "0.6.2", features = [] }
day-piece-settings = { version = "0.6.2" }
day-part-webdav = { path = "..", features = ["reqwest", "demo-server"] }
percent-encoding = "2"

[build-dependencies]
day-build = { version = "0.6.2" }


[workspace]

[workspace.package]
version = "0.1.0"
